    <style>
        .btn-year {
  border-radius: var(--radius);
  padding: 8px 18px;
  font-weight: 500;

  color: var(--color-primary);
  background-color: transparent;
  border: 1px solid var(--color-primary);

  text-decoration: none !important;
}

.btn-year:hover {
  background-color: var(--color-bg-secondary);
  border: 1px solid var(--color-bg-secondary);
  color: var(--color-white);
}

.btn-year.active {
  background-color: var(--color-primary);
  color: var(--color-white);
}

        /* =========================
           EVENTS TABLE
        ========================= */

        .events-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        .events-table thead {
            border-bottom: 2px solid #222;
        }

        .events-table th {
            text-align: left;
            font-weight: 600;
            padding: 15px 12px;
        }

        .events-table td {
            padding: 18px 12px;
            border-bottom: 1px solid #e5e5e5;
            vertical-align: top;
        }

        .events-table tbody tr {
            transition: background 0.2s ease;
        }

        .events-table tbody tr:hover {
            background: #f8f8f8;
        }

        .date {
            width: 28%;
            white-space: nowrap;
        }

        .event {
            font-weight: bold;
            width: 42%;
        }

        .location {
            color: #888;
            width: 30%;
        }

        .events-table a {
            color: #222;
            text-decoration: none;
        }

        .events-table a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            /*
             * On transforme le tableau en blocs
             * sur mobile pour faciliter la lecture.
             */

            .events-table,
            .events-table thead,
            .events-table tbody,
            .events-table th,
            .events-table td,
            .events-table tr {
                display: block;
                width: 100%;
            }

            .events-table thead {
                display: none;
            }

            .events-table tr {
                padding: 20px 0;
                border-bottom: 1px solid #ddd;
            }

            .events-table td {
                padding: 4px 0;
                border: none;
            }

            .events-table td::before {
                display: block;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #888;
                margin-bottom: 2px;
            }            

            .date {
                white-space: normal;
            }
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .pagination button {
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
            background: transparent;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .pagination button:hover {
            text-decoration: underline;
            background-color: var(--color-primary);
            color: var(--color-white);
        }

        .pagination button.active {
            font-weight: 600;
            text-decoration: underline;
        }

        .pagination button:disabled {
            opacity: 0.3;
            cursor: default;
            text-decoration: none;
        }

        .season-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 30px;
}

.month-heading td {
    padding-top: 30px !important;
    font-weight: bold;
    border-bottom: 2px solid #222 !important;
}

.events-table .location a {
    color: inherit;
    text-decoration: none;
}

.events-table .location a:hover {
    text-decoration: underline;
}

    <!-- ICI COPIER LE genererConcertsHTML issu de Gigs.sheets --> 
    <section class="section-main py-5">
    <div class="container">

        <h1>Saisons</h1>

        <div class="season-tabs" id="season-tabs"></div>

        <div id="concerts-container">
            
        </div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script>
       
document.addEventListener("DOMContentLoaded", async function () {
    const GOOGLE_SHEET_CSV_URL =
  "https://docs.google.com/spreadsheets/d/1-r8fH_xr5iSM0nO92prwrgmBWW51jowWPRjepTKZRgs/export?format=csv";

    const monthNames = [
        "Janvier", "Février", "Mars", "Avril",
        "Mai", "Juin", "Juillet", "Août",
        "Septembre", "Octobre", "Novembre", "Décembre"
    ];

    const tabsContainer = document.getElementById("season-tabs");
    const concertsContainer = document.getElementById("concerts-container");

    // Normalise les noms des colonnes Excel
    function normalizeHeader(value) {
        return String(value || "")
            .trim()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
    }

    // Formate l'heure, y compris si Excel la stocke sous forme numérique
    function formatTime(value) {
        if (value === null || value === undefined || value === "") {
            return "";
        }

        if (typeof value === "number") {
            const totalMinutes = Math.round(value * 24 * 60);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;

            return String(hours).padStart(2, "0") + "h" +
                   String(minutes).padStart(2, "0");
        }

        return String(value).trim().replace(/^(\d{1,2}):(\d{2})$/, "$1h$2");
    }

    // Crée un élément texte sans interpréter le contenu Excel comme du HTML
    function addTextCell(row, className, value) {
        const cell = document.createElement("td");
        cell.className = className;
        cell.textContent = value || "";
        row.appendChild(cell);
        return cell;
    }

    // Valide les liens avant de les rendre cliquables
    function safeUrl(value) {
        if (!value) return null;

        try {
            const url = new URL(String(value).trim());
            if (url.protocol === "https:" || url.protocol === "http:") {
                return url.href;
            }
        } catch (error) {
            return null;
        }

        return null;
    }

    try {
        
// Cache local : conservation des données pendant 10 minutes
const CACHE_KEY = "concerts_google_sheet_csv_v1";
const CACHE_DURATION = 10 * 60 * 1000;

let csvText = "";
let cached = null;

// Essaie de récupérer les données déjà enregistrées
try {
    cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
} catch (error) {
    console.warn("Cache local indisponible :", error);
}

// Utilise le cache s'il est encore valable
const cacheIsFresh =
    cached &&
    typeof cached.csv === "string" &&
    Date.now() - cached.timestamp < CACHE_DURATION;

if (cacheIsFresh) {
    csvText = cached.csv;
} else {
    try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL);

        if (!response.ok) {
            throw new Error("Impossible de charger le Google Sheet.");
        }

        csvText = await response.text();

        // Vérifie que Google a bien renvoyé un CSV
        if (!csvText || /<html/i.test(csvText.slice(0, 500))) {
            throw new Error("Google Sheets n'a pas renvoyé les données CSV.");
        }

        // Enregistre les nouvelles données
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify({
                csv: csvText,
                timestamp: Date.now()
            }));
        } catch (error) {
            console.warn("Impossible d'enregistrer le cache :", error);
        }

    } catch (error) {
        // En cas de problème réseau, utilise les anciennes données
        if (cached && typeof cached.csv === "string") {
            csvText = cached.csv;
            console.warn("Utilisation des données en cache :", error);
        } else {
            throw error;
        }
    }
}

// Analyse le CSV
const parsed = Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true,
    transformHeader: header => header.trim()
});

if (parsed.errors.length > 0) {
    console.warn("Avertissements CSV :", parsed.errors);
}

const rawRows = parsed.data;


        if (rawRows.length === 0) {
            throw new Error("Le fichier Excel ne contient aucune ligne.");
        }

        // Repère les colonnes même si « Année » contient un espace final
        const headers = Object.keys(rawRows[0]);
        const columns = {};

        headers.forEach(header => {
            columns[normalizeHeader(header)] = header;
        });

        function getValue(row, columnName) {
            const realColumn = columns[normalizeHeader(columnName)];
            return realColumn ? row[realColumn] : "";
        }

        // Transforme les lignes Excel en concerts
        const concerts = rawRows.map(row => ({
            year: Number(getValue(row, "Année")),
            month: Number(getValue(row, "Mois")),
            day: Number(getValue(row, "Jour")),
            time: formatTime(getValue(row, "Heure")),
            project: String(getValue(row, "Projet") || "").trim(),
            location: String(getValue(row, "Lieu") || "").trim(),
            locationLink: safeUrl(getValue(row, "Lien lieu"))
        })).filter(concert =>
            Number.isInteger(concert.year) &&
            Number.isInteger(concert.month) &&
            concert.month >= 1 &&
            concert.month <= 12 &&
            Number.isInteger(concert.day) &&
            concert.day >= 1 &&
            concert.day <= 31 &&
            (concert.project || concert.location)
        );

        // Trie par année, mois, jour et heure
        concerts.sort((a, b) => {
            return a.year - b.year ||
                   a.month - b.month ||
                   a.day - b.day ||
                   a.time.localeCompare(b.time);
        });

        // Regroupe les concerts par année
        const years = [...new Set(concerts.map(c => c.year))]
            .sort((a, b) => b - a);

        if (years.length === 0) {
            throw new Error("Aucun concert avec une date valide n'a été trouvé.");
        }

        // Affiche les onglets des années
        tabsContainer.innerHTML = "";

        years.forEach(year => {
            const button = document.createElement("button");
            button.className = "btn-year season-tab";
            button.textContent = year;

            button.addEventListener("click", () => {
                showSeason(year, button);
            });

            tabsContainer.appendChild(button);
        });

        // Génère un tableau pour chaque année
        years.forEach(year => {
            const season = document.createElement("div");
            season.className = "season-content";
            season.id = "season-" + year;

            const table = document.createElement("table");
            table.className = "events-table";

            const thead = document.createElement("thead");
            const headerRow = document.createElement("tr");

            addTextCell(headerRow, "date", "Date");
            addTextCell(headerRow, "event", "Projet");
            addTextCell(headerRow, "location", "Lieu");

            thead.appendChild(headerRow);
            table.appendChild(thead);

            const yearConcerts = concerts.filter(c => c.year === year);

            // Regroupe les concerts de cette année par mois
            const months = [...new Set(yearConcerts.map(c => c.month))]
                .sort((a, b) => a - b);

            months.forEach(month => {
                const tbody = document.createElement("tbody");

                // Ligne de titre du mois
                const monthRow = document.createElement("tr");
                monthRow.className = "month-heading";

                const monthTitle = monthNames[month - 1] + " " + year;

                addTextCell(monthRow, "datewd", monthTitle);
                addTextCell(monthRow, "event", "");
                addTextCell(monthRow, "location", "");

                tbody.appendChild(monthRow);

                const monthConcerts = yearConcerts.filter(c => c.month === month);

                monthConcerts.forEach(concert => {
                    const row = document.createElement("tr");

                    const date = new Date(year, month - 1, concert.day);
                    let weekday = new Intl.DateTimeFormat("fr-FR", {
                        weekday: "short"
                    }).format(date);

                    weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);

                    const day = String(concert.day).padStart(2, "0");
                    const monthNumber = String(month).padStart(2, "0");

                    let dateText = weekday + " " + day + "/" + monthNumber;

                    if (concert.time) {
                        dateText += ", " + concert.time;
                    }

                    addTextCell(row, "datewd", dateText);
                    addTextCell(row, "event", concert.project);

                    const locationCell = document.createElement("td");
                    locationCell.className = "location";

                    if (concert.locationLink) {
                        const link = document.createElement("a");
                        link.href = concert.locationLink;
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                        link.textContent = concert.location;
                        locationCell.appendChild(link);
                    } else {
                        locationCell.textContent = concert.location;
                    }

                    row.appendChild(locationCell);
                    tbody.appendChild(row);
                });

                table.appendChild(tbody);
            });

            season.appendChild(table);
            concertsContainer.appendChild(season);
        });

        // Affiche une saison et active son onglet
        function showSeason(year, button) {
            document.querySelectorAll(".season-content").forEach(season => {
                season.classList.remove("active");
            });

            document.querySelectorAll(".season-tab").forEach(tab => {
                tab.classList.remove("active");
            });

            const selectedSeason = document.getElementById("season-" + year);

            if (selectedSeason) {
                selectedSeason.classList.add("active");
                button.classList.add("active");
            }
        }

        // À l'ouverture : année actuelle si disponible, sinon la plus récente
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;

        const defaultYear = years.includes(currentYear) ? currentYear : years[0];

        const defaultButton = [...tabsContainer.querySelectorAll("button")]
            .find(button => Number(button.textContent) === defaultYear);

        showSeason(defaultYear, defaultButton);

        // Descend jusqu'au mois actuel si celui-ci existe dans la saison affichée
        if (defaultYear === currentYear) {
            const monthHeading = document.querySelector(
                "#season-" + defaultYear + " .month-heading:nth-of-type(" + currentMonth + ")"
            );

            // Recherche fiable du titre du mois, indépendamment des mois absents
            const headings = document.querySelectorAll(
                "#season-" + defaultYear + " .month-heading"
            );

            const target = [...headings].find(row =>
                row.textContent.trim() === monthNames[currentMonth - 1] + " " + defaultYear
            );

            if (target) {
                setTimeout(() => {
                    target.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                }, 250);
            }
        }

    } catch (error) {
        console.error("Erreur de génération des concerts :", error);
        concertsContainer.textContent =
            "Impossible de charger les concerts. Vérifie les autorisations d'accès à ton Google Sheets et son URL.";
    }

});
</script>
